name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo na mesma branch cancela a execução anterior, que já não interessa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # O token do job precisa escrever no PR para publicar o comentário de cobertura. Só isso: o
    # resto continua leitura, que é o padrão quando `permissions` é declarado.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A JDK 21 tem que bater com o toolchainVersion de gradle/gradle-daemon-jvm.properties.
      # Se as duas divergirem, o Gradle baixa outra JDK e o cache do setup deixa de valer.
      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Cuida do cache de dependências e do wrapper, e valida o checksum do gradle-wrapper.jar.
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      # spotlessCheck, e não spotlessApply: o CI verifica, não conserta. O hook local é
      # conveniência e pode ser pulado com --no-verify; aqui é onde a regra vale de fato.
      - name: Formatação, análise estática, lint e testes
        run: ./gradlew spotlessCheck detekt lint test

      # Passo próprio, e antes do piso, para que o XML exista mesmo quando a cobertura reprova — o
      # comentário no PR é justamente o que diz onde faltou teste.
      - name: Relatório de cobertura
        run: ./gradlew :koverXmlReport

      # Fixado por SHA e não por tag: esta é a revisão de `main` que renomeou o piso do diff para
      # `min-coverage-changed-lines`, medindo só as linhas que o PR mudou. A v1.8.0, último release,
      # ainda cobra o arquivo inteiro — o que reprovaria um PR de uma linha em arquivo antigo sem
      # teste. Ver ADR 0018. Quando a v2.0 sair, trocar o SHA pela tag.
      #
      # `continue-on-error: false` é obrigatório: o padrão da action é `true`, e com ele o piso
      # viraria enfeite — comentaria o número e deixaria o merge passar.
      - name: Comentar cobertura no PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: madrapps/jacoco-report@dc464cf1e7d917b8a8e073ab95f8c08484957839
        with:
          paths: ${{ github.workspace }}/build/reports/kover/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Cobertura de testes
          update-comment: true
          min-coverage-overall: 60
          min-coverage-changed-lines: 80
          continue-on-error: false

      # Vale para push em main também, onde não há PR para comentar. É a mesma regra do
      # `./gradlew koverVerify` local, então ninguém descobre o piso só aqui.
      - name: Piso de cobertura do projeto
        run: ./gradlew :koverVerify

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-qualidade
          path: |
            app/build/reports/detekt/
            core/build/reports/detekt/
            data/build/reports/detekt/
            app/build/reports/lint-results-*.html
            app/build/reports/tests/
            data/build/reports/tests/
            build/reports/kover/
          if-no-files-found: ignore
          retention-days: 14

  # Job separado do build Android: as Security Rules não dependem do APK, e rodar em paralelo dá
  # retorno mais rápido. O emulador do Firestore é um processo Java, daí o setup de JDK aqui também.
  firestore-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore/package-lock.json

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # `npm ci` e não `npm install`: respeita o package-lock.json e falha se ele divergir.
      - name: Instalar dependências
        working-directory: firestore
        run: npm ci

      - name: Testar Security Rules no emulador
        working-directory: firestore
        run: npm test
